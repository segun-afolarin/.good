<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canteen Subscription Plans</title>
  <link rel="stylesheet" href="/frontEnd/css/subscription.css">
</head>
<body>

<header class="header">
  <h1>SilverGold Canteen Subscription</h1>
  <p>Choose a plan that fits your appetite</p>
</header>

<section class="plans">

  <div class="plan-card">
    <h2>Daily Plan</h2>
    <p class="price">₦1,000</p>
    <p class="duration">Valid for 1 Day</p>

    <form action="subscribe-success.html">
      <input type="text" placeholder="Full Name" required>
      <button type="submit">Subscribe</button>
    </form>
  </div>

  <div class="plan-card popular">
    <h2>Weekly Plan</h2>
    <p class="price">₦5,000</p>
    <p class="duration">Valid for 7 Days</p>

    <form action="subscribe-success.html">
      <input type="text" placeholder="Full Name" required>
      <button type="submit">Subscribe</button>
    </form>
  </div>

  <div class="plan-card">
    <h2>Monthly Plan</h2>
    <p class="price">₦18,000</p>
    <p class="duration">Valid for 30 Days</p>

    <form action="subscribe-success.html">
      <input type="text" placeholder="Full Name" required>
      <button type="submit">Subscribe</button>
    </form>
  </div>

</section>

<footer class="footer">
  <p>© 2026 SilverGold Canteen Subscription System</p>
</footer>

</body>
</html>
